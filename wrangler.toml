name = "asalah-platform"
main = "src/index.js"
# يحافظ على المتغيرات المضافة من لوحة Cloudflare عند كل نشر من GitHub
keep_vars = true
compatibility_date = "2026-10-01"

# ملفات SQL تنضم للكود عشان النظام يجهّز قاعدته بنفسه بعد النشر
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# الصفحات الثابتة (اللوحات وصفحة التحقق). مسارات /api و /img تمر على الـ Worker أولاً.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/img/*", "/media/*", "/stores/p/*", "/stores/m/*", "/s/*", "/sitemap.xml", "/robots.txt", "/merchant/login", "/merchant/login/*", "/admin/login", "/admin/login/*"]

# قاعدة البيانات تنشأ تلقائياً في حسابك أول مرة تنشر (بدون نسخ أي معرّف)
[[d1_databases]]
binding = "DB"
database_name = "asalah"
migrations_dir = "migrations"

# فيديوهات الريلز. الـ bucket ينشأ تلقائياً أول مرة تنشر (لازم R2 يكون مفعّل في الحساب)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "asalah-media"

# فحص المخزون والتنبيهات كل ساعة
[triggers]
crons = ["0 * * * *"]

[vars]
PLATFORM_NAME = "أصالة المنتجات الأصلية"
# معرّف عميل Google لتسجيل دخول الزبائن (عام وليس سراً). السر GOOGLE_CLIENT_SECRET يُضاف من لوحة Cloudflare
# الدومين الرسمي: روابط جوجل والمشاركة وملفات المصنع الجديدة تطلع عليه (رابط workers.dev القديم يظل شغال)
PUBLIC_ORIGIN = "https://alsalah-sa.com"
VERIFY_ORIGIN = "https://alsalah-sa.com"
GOOGLE_CLIENT_ID = "1018874096740-l7h8lnmlbudsognhshdo5bjc0ofo0upf.apps.googleusercontent.com"

# أسرار اختيارية (wrangler secret put <الاسم>):
#   TAG_SECRET   : يوقّع روابط العلامات. لو ما انضاف، يتولّد تلقائياً ويُحفظ في القاعدة.
#                  لا تضيفه ولا تغيّره بعد أول دفعة، لأنه يبطل كل العلامات المطبوعة.
#   SETUP_TOKEN  : لو انضاف، صفحة إنشاء أول مدير تطلبه.
